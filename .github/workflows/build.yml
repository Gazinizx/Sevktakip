name: Build SevkTakip

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sevktakip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios --org com.gazinizx --project-name doyuyosevkiyat
      - name: Ensure Android network permission
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          echo "Verified Android INTERNET permission (needed for HTTPS API calls; no runtime prompt)."
      - name: Prepare Doyuyo app icon
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p assets/icons
          ZIP_PATH="Doyuyo_Sevkiyat_Android_iOS_Icons.zip"
          test -s "$ZIP_PATH" || { echo "::error::Doyuyo icon ZIP is missing from repository root."; exit 1; }
          unzip -o "$ZIP_PATH" -d assets/icons
          SOURCE_ICON="assets/icons/doyuyo-sevkiyat-1024x1024.png"
          test -s "$SOURCE_ICON" || { echo "::error::Expected 1024x1024 PNG not found inside the uploaded icon ZIP."; find assets/icons -maxdepth 2 -type f -print; exit 1; }
          cp "$SOURCE_ICON" assets/doyuyo-app-icon.png
          test -s assets/doyuyo-app-icon.png
      - run: flutter pub get
      - name: Set Android app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Doyuyo Sevkiyat"/' android/app/src/main/AndroidManifest.xml
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sevktakip-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios --org com.gazinizx --project-name doyuyosevkiyat
      - name: Validate iOS secure network configuration
        shell: bash
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$PLIST" >/dev/null 2>&1; then
            echo "::error::Do not enable arbitrary insecure HTTP loads. Supabase must use HTTPS."
            exit 1
          fi
          echo "Verified iOS uses Apple's default HTTPS transport security; no broad ATS exception added."
      - name: Prepare Doyuyo app icon
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p assets/icons
          ZIP_PATH="Doyuyo_Sevkiyat_Android_iOS_Icons.zip"
          test -s "$ZIP_PATH" || { echo "::error::Doyuyo icon ZIP is missing from repository root."; exit 1; }
          unzip -o "$ZIP_PATH" -d assets/icons
          SOURCE_ICON="assets/icons/doyuyo-sevkiyat-1024x1024.png"
          test -s "$SOURCE_ICON" || { echo "::error::Expected 1024x1024 PNG not found inside the uploaded icon ZIP."; find assets/icons -maxdepth 2 -type f -print; exit 1; }
          cp "$SOURCE_ICON" assets/doyuyo-app-icon.png
          test -s assets/doyuyo-app-icon.png
      - run: flutter pub get
      - name: Set app display name
        run: |
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Doyuyo Sevkiyat' ios/Runner/Info.plist
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Import Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_BASE64" || { echo "Missing IOS_CERTIFICATE_BASE64 repository secret"; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo "Missing IOS_CERTIFICATE_PASSWORD repository secret"; exit 1; }
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          if ! openssl pkcs12 -in "$CERT_PATH" -passin env:IOS_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::The P12 file and IOS_CERTIFICATE_PASSWORD do not match, or IOS_CERTIFICATE_BASE64 is not a valid PKCS#12 file. Re-export the intended Apple Distribution .p12 and update both GitHub Actions secrets."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Available code-signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/valid identities found/ {print $1}')"
          if [ "${IDENTITY_COUNT:-0}" -lt 1 ]; then
            echo "::error::The P12 was imported but macOS found no valid code-signing identity. Export a valid Apple Distribution certificate WITH its private key from Keychain Access, then update IOS_CERTIFICATE_BASE64 and IOS_CERTIFICATE_PASSWORD."
            exit 1
          fi
      - name: Install App Store provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          elif [ -f "Doyuyo_Sevkiyat_App_Store.mobileprovision" ]; then
            cp "Doyuyo_Sevkiyat_App_Store.mobileprovision" "$PROFILE_PATH"
          else
            echo "Missing provisioning profile: add IOS_PROVISIONING_PROFILE_BASE64 secret or commit Doyuyo_Sevkiyat_App_Store.mobileprovision"
            exit 1
          fi
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          EXPECTED_APP_ID="com.gazinizx.doyuyosevkiyat"
          EXPECTED_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          test -n "$EXPECTED_TEAM_ID" || { echo "::error::Missing APPLE_TEAM_ID repository secret"; exit 1; }
          if [ "$PROFILE_APP_ID" != "$EXPECTED_TEAM_ID.$EXPECTED_APP_ID" ]; then
            echo "::error::Provisioning profile App ID mismatch. Expected $EXPECTED_TEAM_ID.$EXPECTED_APP_ID but found $PROFILE_APP_ID"
            exit 1
          fi
          if [ "$PROFILE_TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID mismatch. Expected $EXPECTED_TEAM_ID but found $PROFILE_TEAM_ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Validated profile: $PROFILE_NAME ($PROFILE_UUID), app=$PROFILE_APP_ID, team=$PROFILE_TEAM_ID"
      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.gazinizx.doyuyosevkiyat</key><string>$PROFILE_NAME</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
      - name: Create unsigned iOS archive
        run: |
          set -euo pipefail
          flutter build ipa --release --no-codesign
          test -d build/ios/archive/Runner.xcarchive || { echo "::error::Flutter did not produce build/ios/archive/Runner.xcarchive"; find build/ios -maxdepth 3 -print; exit 1; }
      - name: Export and sign IPA with Apple Distribution
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "build/ios/archive/Runner.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates
          shopt -s nullglob
          IPAS=(build/ios/ipa/*.ipa)
          if [ "${#IPAS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one exported IPA, found ${#IPAS[@]}"
            find build/ios/ipa -maxdepth 2 -type f -print
            exit 1
          fi
          echo "Exported signed IPA: ${IPAS[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: doyuyo-sevkiyat-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || { echo "Missing APP_STORE_CONNECT_API_KEY_ID repository secret"; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID repository secret"; exit 1; }
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64" || { echo "Missing APP_STORE_CONNECT_API_KEY_BASE64 repository secret"; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop target
        run: flutter create . --platforms=windows --org com.gazinizx --project-name doyuyosevkiyat
      - name: Prepare app icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "Doyuyo_Sevkiyat_Android_iOS_Icons.zip"
          if (!(Test-Path $zipPath)) { throw "Doyuyo icon ZIP is missing from repository root." }
          Expand-Archive -Path $zipPath -DestinationPath "assets/icons" -Force
          $sourceIcon = "assets/icons/doyuyo-sevkiyat-1024x1024.png"
          if (!(Test-Path $sourceIcon)) { throw "Expected 1024x1024 PNG not found inside icon ZIP." }
          Copy-Item $sourceIcon "assets/doyuyo-app-icon.png" -Force
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package one Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path "$releaseDir/doyuyosevkiyat.exe")) { throw "Windows release executable was not produced." }
          $iss = @'
          #define MyAppName "Doyuyo Sevkiyat"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Doyuyo"
          #define MyAppExeName "doyuyosevkiyat.exe"
          [Setup]
          AppId={{D7A6B0CB-1D43-4A8A-9F4C-3F49A12D2A11}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Doyuyo Sevkiyat
          DefaultGroupName=Doyuyo Sevkiyat
          OutputDir=build\windows\installer
          OutputBaseFilename=Doyuyo-Sevkiyat-Windows-Setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\{#MyAppExeName}
          [Tasks]
          Name: "desktopicon"; Description: "Masaüstüne kısayol oluştur"; GroupDescription: "Ek seçenekler:"
          [Files]
          Source: "$releaseDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Doyuyo Sevkiyat"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Doyuyo Sevkiyat"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Doyuyo Sevkiyat uygulamasını başlat"; Flags: postinstall nowait skipifsilent
          '@
          New-Item -ItemType Directory -Force "build/windows/installer" | Out-Null
          Set-Content -Path "build/windows/Doyuyo-Sevkiyat.iss" -Value $iss -Encoding ASCII
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup" -Filter "ISCC.exe" -Recurse | Select-Object -First 1
          if (!$iscc) { throw "Inno Setup compiler (ISCC.exe) not found." }
          & $iscc.FullName "build/windows/Doyuyo-Sevkiyat.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          if (!(Test-Path "build/windows/installer/Doyuyo-Sevkiyat-Windows-Setup.exe")) { throw "Installer output missing." }
      - uses: actions/upload-artifact@v4
        with:
          name: doyuyo-sevkiyat-windows-installer
          path: build/windows/installer/Doyuyo-Sevkiyat-Windows-Setup.exe
          if-no-files-found: error
