name: Build SevkTakip

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sevktakip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios
      - name: Prepare Doyuyo app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --retry-all-errors "https://www.google.com/s2/favicons?domain=doyuyo.com&sz=512" --output /tmp/doyuyo-icon.png
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/python -m pip install --quiet --upgrade pip Pillow
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image
          source = Image.open('/tmp/doyuyo-icon.png').convert('RGBA')
          source.load()
          source.thumbnail((820, 820), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          canvas.alpha_composite(source, ((1024-source.width)//2, (1024-source.height)//2))
          canvas.convert('RGB').save('assets/doyuyo-app-icon.png')
          print(f'Prepared Doyuyo icon from downloaded image: {source.size}')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sevktakip-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios
      - name: Prepare Doyuyo app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --retry-all-errors "https://www.google.com/s2/favicons?domain=doyuyo.com&sz=512" --output /tmp/doyuyo-icon.png
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/python -m pip install --quiet --upgrade pip Pillow
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image
          source = Image.open('/tmp/doyuyo-icon.png').convert('RGBA')
          source.load()
          source.thumbnail((820, 820), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          canvas.alpha_composite(source, ((1024-source.width)//2, (1024-source.height)//2))
          canvas.convert('RGB').save('assets/doyuyo-app-icon.png')
          print(f'Prepared Doyuyo icon from downloaded image: {source.size}')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: sevktakip-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
