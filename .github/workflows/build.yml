name: Build SevkTakip

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sevktakip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios
      - name: Prepare official Doyuyo app icon
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 https://doyuyo.com/favicon.ico --output /tmp/doyuyo.ico
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          source = Image.open('/tmp/doyuyo.ico').convert('RGBA')
          source.thumbnail((820, 820), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          canvas.alpha_composite(source, ((1024-source.width)//2, (1024-source.height)//2))
          canvas.convert('RGB').save('assets/doyuyo-app-icon.png', quality=100)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sevktakip-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android,ios
      - name: Prepare official Doyuyo app icon
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 https://doyuyo.com/favicon.ico --output /tmp/doyuyo.ico
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          source = Image.open('/tmp/doyuyo.ico').convert('RGBA')
          source.thumbnail((820, 820), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          canvas.alpha_composite(source, ((1024-source.width)//2, (1024-source.height)//2))
          canvas.convert('RGB').save('assets/doyuyo-app-icon.png', quality=100)
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: sevktakip-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
