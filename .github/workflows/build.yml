name: Build Doyuyo Sevkiyat Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml

concurrency:
  group: doyuyo-sevkiyat-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop target
        run: flutter create . --platforms=windows --org com.gazinizx --project-name doyuyosevkiyat
      - name: Prepare app icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "Doyuyo_Sevkiyat_Android_iOS_Icons.zip"
          if (!(Test-Path $zipPath)) { throw "Doyuyo icon ZIP is missing from repository root." }
          Expand-Archive -Path $zipPath -DestinationPath "assets/icons" -Force
          $sourceIcon = "assets/icons/doyuyo-sevkiyat-1024x1024.png"
          if (!(Test-Path $sourceIcon)) { throw "Expected 1024x1024 PNG not found inside icon ZIP." }
          Copy-Item $sourceIcon "assets/doyuyo-app-icon.png" -Force
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package one Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build/windows/x64/runner/Release"
          $exePath = Join-Path $releaseDir "doyuyosevkiyat.exe"
          if (!(Test-Path $exePath -PathType Leaf)) { throw "Windows release executable was not produced at $exePath." }

          $iss = @'
          #define MyAppName "Doyuyo Sevkiyat"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Doyuyo"
          #define MyAppExeName "doyuyosevkiyat.exe"
          [Setup]
          AppId={{D7A6B0CB-1D43-4A8A-9F4C-3F49A12D2A11}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Doyuyo Sevkiyat
          DefaultGroupName=Doyuyo Sevkiyat
          OutputDir=build\windows\installer
          OutputBaseFilename=Doyuyo-Sevkiyat-Windows-Setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\{#MyAppExeName}
          [Tasks]
          Name: "desktopicon"; Description: "Masaüstüne kısayol oluştur"; GroupDescription: "Ek seçenekler:"
          [Files]
          Source: "$releaseDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Doyuyo Sevkiyat"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Doyuyo Sevkiyat"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Doyuyo Sevkiyat uygulamasını başlat"; Flags: postinstall nowait skipifsilent
          '@

          $installerDir = "build/windows/installer"
          New-Item -ItemType Directory -Force $installerDir | Out-Null
          Set-Content -Path "build/windows/Doyuyo-Sevkiyat.iss" -Value $iss -Encoding ASCII

          $isccPath = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          if (!$isccPath) {
            $candidates = @(
              (Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6/ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6/ISCC.exe"),
              (Join-Path "${env:ProgramFiles(x86)}" "Inno Setup/ISCC.exe")
            ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }
            if ($candidates.Count -gt 0) { $isccPath = $candidates[0] }
          }
          if (!$isccPath) {
            $searchRoots = @("${env:ProgramFiles(x86)}", $env:ProgramFiles, "C:\ProgramData\chocolatey\lib")
            foreach ($root in ($searchRoots | Where-Object { $_ -and (Test-Path $_ -PathType Container) })) {
              $found = Get-ChildItem -Path $root -Filter "ISCC.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $isccPath = $found.FullName; break }
            }
          }
          if (!$isccPath) { throw "Inno Setup compiler ISCC.exe was not found after installation. Checked PATH and standard install locations." }

          & $isccPath "build/windows/Doyuyo-Sevkiyat.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installerPath = Join-Path $installerDir "Doyuyo-Sevkiyat-Windows-Setup.exe"
          if (!(Test-Path $installerPath -PathType Leaf)) { throw "Installer output missing: $installerPath" }
          if ((Get-Item $installerPath).Length -lt 1MB) { throw "Installer output is unexpectedly small; refusing to publish a likely invalid installer." }
      - uses: actions/upload-artifact@v4
        with:
          name: doyuyo-sevkiyat-windows-installer
          path: build/windows/installer/Doyuyo-Sevkiyat-Windows-Setup.exe
          if-no-files-found: error
